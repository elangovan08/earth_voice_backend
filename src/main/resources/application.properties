spring.application.name=ecoblog-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/blogdb}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.upload-dir=${UPLOAD_DIR:uploads}
app.base-url=${APP_BASE_URL:http://localhost:3000}

app.security.jwt.secret=${JWT_SECRET:change-this-development-secret-before-production}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.admin.name=${ADMIN_NAME:Elangovan}
app.security.admin.email=${ADMIN_EMAIL:elangovandev27@gmail.com}

app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
app.notifications.recipient=${ADMIN_NOTIFICATION_EMAIL:${NOTIFICATION_RECIPIENT:elangovandev27@gmail.com}}
app.notifications.from=${MAIL_FROM:${NOTIFICATION_FROM:${MAIL_USERNAME:}}}
app.notifications.from-name=${MAIL_FROM_NAME:EarthVoice}

# Gmail SMTP. Use a Gmail app password in MAIL_PASSWORD; never commit credentials.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

huggingface.api-token=${HF_TOKEN:}
huggingface.image-model=${HF_IMAGE_MODEL:stabilityai/stable-diffusion-xl-base-1.0}
huggingface.image-url=${HF_IMAGE_URL:https://api-inference.huggingface.co/models}
huggingface.width=${HF_IMAGE_WIDTH:1024}
huggingface.height=${HF_IMAGE_HEIGHT:576}
huggingface.num-inference-steps=${HF_IMAGE_STEPS:25}
huggingface.guidance-scale=${HF_IMAGE_GUIDANCE_SCALE:7.0}
huggingface.negative-prompt=${HF_IMAGE_NEGATIVE_PROMPT:blurry, low quality, distorted, text artifacts}
